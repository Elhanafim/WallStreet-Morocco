version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Wait a few days before proposing brand-new releases (defence against
    # freshly published malicious versions). Security updates are not delayed.
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/price_service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "security"
      - "python"

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      scripts-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "security"
      - "python"

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "security"
